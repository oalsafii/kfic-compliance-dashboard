<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Personal operating desk for Kuwait compliance work.">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F6F4" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2022%2022%22%3E%3Crect%20width%3D%2222%22%20height%3D%2222%22%20rx%3D%224%22%20fill%3D%22%23111418%22%2F%3E%3Cpath%20d%3D%22M4%203.5%20L18%203.5%20L11%2011%20L18%2018.5%20L4%2018.5%20L11%2011%20Z%22%20fill%3D%22%23C99457%22%2F%3E%3C%2Fsvg%3E">
<style>
  /* The skeleton the Artifact host would otherwise provide. */
  html{color-scheme:light dark}
  body{margin:0;font:14px system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>

<body>
<title>KFIC Compliance Desk</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#F5F6F4; --panel:#FFFFFF; --panel-2:#FAFAF8;
  --ink:#15181D; --ink-2:#4A5159; --ink-3:#757D86;
  --rule:#E2E4DF; --rule-2:#D2D5CE;
  --bronze:#9A6B35; --bronze-soft:#F0E7DA;
  --late:#C2453C; --soon:#B07C06; --clear:#3C7D63;
  --shade:#ECEEE9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111418; --panel:#181C22; --panel-2:#1D2229;
    --ink:#E8EAE7; --ink-2:#A7AEB5; --ink-3:#767E87;
    --rule:#262C34; --rule-2:#333A43;
    --bronze:#C99457; --bronze-soft:#2A2119;
    --late:#E5695E; --soon:#E0A93B; --clear:#5FB68E;
    --shade:#1C2127;
  }
}
:root[data-theme="dark"]{
  --ground:#111418; --panel:#181C22; --panel-2:#1D2229;
  --ink:#E8EAE7; --ink-2:#A7AEB5; --ink-3:#767E87;
  --rule:#262C34; --rule-2:#333A43;
  --bronze:#C99457; --bronze-soft:#2A2119;
  --late:#E5695E; --soon:#E0A93B; --clear:#5FB68E;
  --shade:#1C2127;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Archivo',system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ar{font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;unicode-bidi:isolate}
.wrap{max-width:860px;margin:0 auto;padding-inline:20px}
@media(max-width:520px){.wrap{padding-inline:16px}}

header{background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10}
.hrow{display:flex;align-items:center;gap:18px;padding-block:11px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:9px}
.mark b{font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;letter-spacing:.09em}
.mark span{font-size:10px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;display:block;line-height:1.2}
.today{font-size:12.5px;color:var(--ink-2)}
.today .day{color:var(--ink);font-weight:500}
.next{margin-inline-start:auto;display:flex;align-items:center;gap:11px;
  border-inline-start:2px solid var(--bronze);padding-inline-start:13px}
.next-k{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  font-family:'Archivo',sans-serif;font-weight:600}
.next-t{font-size:12.5px;max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-c{font-size:21px;font-weight:600;line-height:1.1;text-align:end}
.ico{background:none;border:1px solid var(--rule-2);color:var(--ink-2);width:29px;height:29px;
  border-radius:5px;cursor:pointer;font-size:13px}
.ico:hover{border-color:var(--bronze);color:var(--bronze)}

.runway{background:var(--panel);border-bottom:1px solid var(--rule);padding-bottom:14px}
.rlabel{font-family:'Archivo',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);padding-block:12px 7px}
.rscroll{overflow-x:auto}
.ruler{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(54px,1fr);min-width:600px;
  border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.d{border-inline-end:1px solid var(--rule);padding:6px 5px 8px;min-height:74px;background:var(--panel);
  display:flex;flex-direction:column;gap:4px}
.d:last-child{border-inline-end:none}
.d.off{background:var(--shade)}
.d.now{background:var(--bronze-soft);box-shadow:inset 0 2px 0 var(--bronze)}
.dn{font-size:14px;font-weight:600;line-height:1}
.dd{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  font-family:'Archivo',sans-serif;font-weight:600}
.dot{height:4px;border-radius:2px;background:var(--ink-3)}
.dot.late{background:var(--late)} .dot.soon{background:var(--soon)}

.acts{display:flex;gap:7px;flex-wrap:wrap;padding-block:18px 2px}
.act{font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:600;
  background:var(--panel);border:1px solid var(--rule-2);color:var(--ink);
  padding:8px 13px;border-radius:6px;cursor:pointer}
.act:hover{border-color:var(--bronze);color:var(--bronze)}
.act.primary{background:var(--bronze);border-color:var(--bronze);color:#fff}
:root[data-theme="dark"] .act.primary{color:#14181C}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .act.primary{color:#14181C}}
.act.primary:hover{opacity:.9}

main{padding-block:4px 40px}
.grp{margin-top:22px}
.grp h2{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin:0 0 7px;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.grp h2 i{font-style:normal;font-family:'IBM Plex Mono',monospace;color:var(--ink-3);font-size:10.5px}
.rows{border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--rule);
  display:flex;flex-direction:column;gap:1px}
.row{background:var(--panel);display:grid;grid-template-columns:3px 1fr auto;align-items:center;
  gap:0 12px;padding:11px 13px 11px 0}
.row .bar{height:100%;background:var(--ink-3);align-self:stretch}
.row.late .bar{background:var(--late)} .row.soon .bar{background:var(--soon)}
.rt{font-size:13.5px;font-weight:500;line-height:1.35}
/* Arabic rule text: isolated so the words order correctly, but on an LTR
   base so the line sits under the title instead of crowding the date. */
.rr{font-size:11px;color:var(--ink-3);line-height:1.5;margin-top:3px;
  font-family:'IBM Plex Sans Arabic',sans-serif;direction:ltr;unicode-bidi:isolate;text-align:start}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.pill{display:inline-block;padding:1.5px 6px;border-radius:3px;font-size:10px;font-weight:600;
  font-family:'Archivo',sans-serif;background:var(--shade);color:var(--ink-2)}
.pill.ex{background:transparent;border:1px dashed var(--rule-2);color:var(--ink-3);font-weight:500}
.right{display:flex;align-items:center;gap:11px}
.when{text-align:end;white-space:nowrap}
.when b{display:block;font-size:12.5px;font-weight:600}
.when span{display:block;font-size:10.5px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace}
.when.late b{color:var(--late)} .when.soon b{color:var(--soon)}
.done{font-family:'Archivo',sans-serif;font-size:10.5px;font-weight:600;background:var(--panel-2);
  border:1px solid var(--rule-2);color:var(--ink-2);padding:4px 9px;border-radius:4px;cursor:pointer}
.done:hover{border-color:var(--clear);color:var(--clear)}
.empty{border:1px dashed var(--rule-2);border-radius:7px;padding:26px 18px;text-align:center;
  color:var(--ink-3);font-size:12.5px;line-height:1.6}

.seed{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--rule);border-inline-start:2px solid var(--bronze);
  border-radius:6px;padding:9px 12px;margin-top:20px;font-size:12px;color:var(--ink-2)}
footer{border-top:1px solid var(--rule);margin-top:30px;padding-block:14px 30px;
  font-size:11.5px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
footer button{background:none;border:none;color:var(--ink-2);font:inherit;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;padding:0}
footer button:hover{color:var(--bronze)}

dialog{border:1px solid var(--rule-2);border-radius:9px;padding:0;background:var(--panel);
  color:var(--ink);max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:rgba(10,12,15,.5)}
.dh{padding:13px 16px;border-bottom:1px solid var(--rule);font-family:'Archivo',sans-serif;
  font-size:14px;font-weight:600}
.db{padding:15px 16px;max-height:62vh;overflow-y:auto}
.df{padding:11px 16px;border-top:1px solid var(--rule);display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:10px;font-family:'Archivo',sans-serif;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
input,select{width:100%;background:var(--panel-2);border:1px solid var(--rule-2);color:var(--ink);
  border-radius:5px;padding:7px 9px;font-family:inherit;font-size:13px}
:focus-visible{outline:2px solid var(--bronze);outline-offset:1px}
.prev{border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-top:2px}
.pr{padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.pr+.pr{border-top:1px solid var(--rule)}
.pr .t{font-size:12.5px;font-weight:500}
.pr .dte{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;white-space:nowrap}
.pr .rl{grid-column:1/3;font-size:11px;color:var(--ink-3);line-height:1.5}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header>
  <div class="wrap hrow">
    <div class="mark">
      <svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true">
        <path d="M3 2 L19 2 L11 11 L19 20 L3 20 L11 11 Z" fill="var(--bronze)"/>
      </svg>
      <div><b>KFIC</b><span>Compliance Desk</span></div>
    </div>
    <div class="today"><span id="h-date" class="day mono">—</span> · <span id="h-state">—</span></div>
    <div class="next">
      <div>
        <div class="next-k">Next due</div>
        <div id="h-next" class="next-t">—</div>
      </div>
      <div class="next-c mono" id="h-count">—</div>
      <button class="ico" id="theme" aria-label="Switch theme" title="Switch theme">◐</button>
    </div>
  </div>
</header>

<section class="runway">
  <div class="wrap">
    <div class="rlabel">Next 14 days · Friday &amp; Saturday shaded</div>
    <div class="rscroll"><div class="ruler" id="ruler"></div></div>
  </div>
</section>

<main class="wrap">
  <div class="acts">
    <button class="act primary" id="a-disc">New disclosure</button>
    <button class="act" id="a-ent">Entitlement dates</button>
    <button class="act" id="a-add">Add a date</button>
  </div>

  <div id="list"></div>

  <div class="seed" id="seed" hidden>
    <span>Showing three example dates so the page isn't blank.</span>
    <button class="act" id="a-clear">Clear them</button>
  </div>

  <footer>
    <span id="cal-note">—</span>
    <button id="a-hol">Holidays</button>
    <button id="a-backup">Back up</button>
    <button id="a-restore">Restore</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <span id="note"></span>
  </footer>
</main>

<dialog id="dlg">
  <div class="dh" id="d-title">—</div>
  <div class="db" id="d-body"></div>
  <div class="df" id="d-foot"></div>
</dialog>

<script>
"use strict";

/* ============ Kuwait calendar — Fri+Sat weekend, holidays entered ============ */
const DAY_AR=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAY_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const diff=(a,b)=>Math.round((day0(b)-day0(a))/86400000);
const isWeekend=d=>d.getDay()===5||d.getDay()===6;
const isHoliday=d=>S.holidays.includes(iso(d));
const isBiz=d=>!isWeekend(d)&&!isHoliday(d);
function addBiz(d,n){let x=new Date(d),s=n<0?-1:1,k=Math.abs(n);while(k>0){x=addDays(x,s);if(isBiz(x))k--}return x}
function roll(d){let x=new Date(d);while(!isBiz(x))x=addDays(x,1);return x}
const fmt=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const fmtS=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
const NOW=()=>new Date();

/* Material information outside hours: 15 minutes before the next session (09:00). */
function cutoff(from){
  let d=new Date(from), m=d.getHours()*60+d.getMinutes();
  if(!isBiz(d)||m>=525) d=roll(addDays(d,1));
  const c=day0(d); c.setHours(8,45,0,0); return c;
}

/* ============ The rules. Arabic quoted verbatim — it is the justification. ============ */
const KINDS=[
 {id:'material_out',l:'Material information — arose outside working hours',a:'ملحق 10',r:'قبل 15 دقيقة على الأقل من جلسة التداول التالية',c:'cut'},
 {id:'material_in', l:'Material information — arose during working hours',a:'ملحق 10',r:'الإفصاح فوراً',c:'now'},
 {id:'board_res',   l:'Board meeting — results',a:'ملحق 10',r:'تُفصح خلالها أو قبل 15 دقيقة من الجلسة التالية',c:'cut'},
 {id:'board_call',  l:'Board meeting — invitation',a:'ملحق 9',r:'الدعوة للاجتماع',c:'now'},
 {id:'litigation',  l:'Litigation or judgment (initial or supplementary)',a:'ملحق 7',r:'الملحق 7 لكل إفصاح متعلق بدعوى أو حكم — لا يُستخدم الملحق 12 إطلاقاً',c:'now'},
 {id:'rating',      l:'Credit rating — new or changed',a:'ملحق 8',r:'تصنيف ائتماني جديد أو متغيّر',c:'now'},
 {id:'agm_call',    l:'General assembly — invitation',a:'ملحق 14',r:'قبل 5 أيام عمل من تاريخ حيازة حق الحضور',c:'before',n:5},
 {id:'bonds',       l:'Listed bonds or sukuk',a:'ملحق 13',r:'سندات/صكوك مدرجة',c:'now'},
 {id:'corp_action', l:'Share entitlements / corporate action',a:'نموذج استحقاقات الأسهم',r:'مسار الرفع (ب): البورصة أولاً ثم الهيئة آخراً',c:'now'},
 {id:'corrective',  l:'Corrective — fixes wrong information announced',a:'ملحق 11',r:'يصحّح معلومة خاطئة في إعلان سابق',c:'now'},
 {id:'supplementary',l:'Supplementary — adds a development',a:'ملحق 12',r:'يضيف تطوراً جديداً (إلا الدعاوى والأحكام)',c:'now'},
 {id:'bo_initial',  l:'Beneficial owner — first time at 5% or more',a:'ملحق 1',r:'المهلة: 5 أيام عمل',c:'biz',n:5},
 {id:'bo_change',   l:'Beneficial owner — change exceeding 0.5%',a:'ملحق 2',r:'المهلة: 10 أيام عمل',c:'biz',n:10},
 {id:'bo_group',    l:'Group ownership aggregating 5% or more',a:'ملحق 3',r:'ملكية مجموعة مجمّعة 5% فأكثر',c:'biz',n:5},
 {id:'major_annual',l:'Annual disclosure of major holders (5%+)',a:'ملحق 4',r:'إفصاح سنوي عن كبار الملاك',c:'biz',n:5},
 {id:'insider_list',l:'Insider list — creation or update',a:'ملحق 5',r:'التحديث خلال 5 أيام عمل من التغيّر',c:'biz',n:5},
 {id:'insider_deal',l:'Insider dealt in the security',a:'ملحق 6',r:'خلال يومي عمل (قبل الجلسة الثالثة)',c:'biz',n:2},
];

/* The استحقاقات timetable, computed off the assembly date. */
const ENT=[
 {t:'إخطار من الجمعية — نموذج المقاصة وجدول الأعمال وتقرير الحوكمة',r:'قبل 5 أيام عمل على الأقل من تاريخ حق حضور الجمعية',f:'attend',biz:-5},
 {t:'الإعلان الأول — إعلان بالجريدة',r:'قبل 7 أيام على الأقل من الإعلان التذكيري',f:'remind',cal:-7},
 {t:'حيازة حق الحضور',r:'ثلاثة أيام تداول قبل تاريخ حق الحضور',f:'attend',biz:-3},
 {t:'حق حضور الجمعية العامة',r:'قبل 10 أيام من تاريخ الجمعية — وإن وقع في عطلة يؤخذ بيوم العمل التالي',f:'agm',cal:-10,roll:1},
 {t:'الإعلان التذكيري',r:'قبل 7 أيام على الأقل من موعد الجمعية',f:'agm',cal:-7},
 {t:'إفصاح نتائج الجمعية',r:'نفس يوم الجمعية العامة',f:'agm',cal:0},
 {t:'تأكيد نموذج الاستحقاق',r:'قبل 8 أيام على الأقل من يوم الاستحقاق',f:'ent',cal:-8},
 {t:'يوم حيازة السهم',r:'ثلاثة أيام تداول قبل يوم استحقاق السهم',f:'ent',biz:-3},
 {t:'يوم الاستحقاق',r:'حسب جدول أعمال الجمعية (15 يوم عمل على الأقل بعد الجمعية)',f:'ent',cal:0},
 {t:'يوم التوزيع',r:'حسب جدول أعمال الجمعية (4 أيام بعد يوم الاستحقاق)',f:'ent',cal:4},
 {t:'محضر الجمعية وتعديل سجل الاستثمار — الهيئة والبنك المركزي',r:'خلال مدة أقصاها 10 أيام عمل بعد انعقاد الجمعية',f:'agm',biz:10},
];

function deriveDisc(id,evISO,anchorISO){
  const k=KINDS.find(x=>x.id===id), ev=parse(evISO);
  let due, exact=null;
  if(k.c==='cut'){ exact=cutoff(ev); due=day0(exact); }
  else if(k.c==='biz') due=addBiz(ev,k.n);
  else if(k.c==='before') due=addBiz(anchorISO?parse(anchorISO):ev,-k.n);
  else due=roll(ev);
  return {annex:k.a,rule:k.r,label:k.l,due:iso(due),exact};
}
function deriveEnt(agmISO,entISO){
  const agm=parse(agmISO);
  const A={agm,attend:roll(addDays(agm,-10)),remind:addDays(agm,-7),
           ent:entISO?parse(entISO):addBiz(agm,15)};
  return ENT.map(s=>{
    const b=A[s.f]; let d=new Date(b);
    if(s.biz!==undefined)d=addBiz(b,s.biz);
    if(s.cal!==undefined)d=addDays(b,s.cal);
    if(s.roll)d=roll(d);
    return {t:s.t,rule:s.r,due:iso(d)};
  }).sort((a,b)=>a.due.localeCompare(b.due));
}

/* ============ state ============ */
const KEY='kfic-desk-v2';
const BLANK={items:[],holidays:[],seeded:null};
let S=structuredClone(BLANK), DB=null, DL=null;

const uid=()=>'x'+Math.random().toString(36).slice(2,9);
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}
  if(DB) DB.doc('state/desk').set({...S,savedAt:new Date().toISOString()}).catch(()=>{});
}
function add(o){ S.items.push({id:uid(),done:false,...o}); }

const live=()=>S.items.filter(i=>!i.done);
const stat=i=>{const d=diff(NOW(),parse(i.due));return d<0?'late':d<=2?'soon':''};
function label(i){
  const d=diff(NOW(),parse(i.due));
  if(d<0) return `${Math.abs(d)}d late`;
  if(d===0) return 'Today';
  if(d===1) return 'Tomorrow';
  return `${d} days`;
}

/* ============ render ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function head(){
  const n=NOW();
  $('#h-date').textContent=fmt(n);
  $('#h-state').textContent=isHoliday(n)?'Holiday'
    :isWeekend(n)?DAY_AR[n.getDay()]+' · weekend':'Business day';
  const u=live().slice().sort((a,b)=>a.due.localeCompare(b.due))[0];
  $('#h-next').textContent=u?u.title:'Nothing due';
  $('#h-count').textContent=u?label(u):'—';
  $('#h-count').style.color=u
    ? (stat(u)==='late'?'var(--late)':stat(u)==='soon'?'var(--soon)':'var(--ink)')
    : 'var(--ink-3)';
}

function ruler(){
  const t=day0(NOW()), el=$('#ruler'); el.innerHTML='';
  for(let i=0;i<14;i++){
    const d=addDays(t,i), on=live().filter(x=>x.due===iso(d));
    const c=document.createElement('div');
    c.className='d'+(isBiz(d)?'':' off')+(i===0?' now':'');
    c.innerHTML=`<div class="dd">${DAY_EN[d.getDay()]}</div><div class="dn mono">${String(d.getDate()).padStart(2,'0')}</div>`
      + on.slice(0,4).map(x=>`<div class="dot ${stat(x)}" title="${esc(x.title)}"></div>`).join('');
    el.appendChild(c);
  }
}

function row(i){
  const st=stat(i);
  return `<div class="row ${st}">
    <div class="bar"></div>
    <div>
      <div class="rt" dir="auto">${esc(i.title)}</div>
      ${i.rule?`<div class="rr">${esc(i.rule)}</div>`:''}
      ${(i.annex||i.example)?`<div class="meta">
        ${i.annex?`<span class="pill" dir="auto">${esc(i.annex)}</span>`:''}
        ${i.example?'<span class="pill ex">example</span>':''}</div>`:''}
    </div>
    <div class="right">
      <div class="when ${st}"><b>${label(i)}</b><span>${fmtS(parse(i.due))}</span></div>
      <button class="done" data-done="${i.id}">Done</button>
    </div>
  </div>`;
}

function list(){
  const all=live().slice().sort((a,b)=>a.due.localeCompare(b.due));
  const groups=[
    ['Overdue',   all.filter(i=>diff(NOW(),parse(i.due))<0)],
    ['This week', all.filter(i=>{const d=diff(NOW(),parse(i.due));return d>=0&&d<=6})],
    ['Later',     all.filter(i=>diff(NOW(),parse(i.due))>6)],
  ].filter(([,a])=>a.length);

  $('#list').innerHTML = groups.length
    ? groups.map(([t,a])=>`<div class="grp"><h2>${t} <i>${a.length}</i></h2>
        <div class="rows">${a.map(row).join('')}</div></div>`).join('')
    : `<div class="grp"><div class="empty">Nothing due.<br>Start a disclosure and the deadline is worked out for you.</div></div>`;

  $('#seed').hidden = !S.items.some(i=>i.example&&!i.done);
  $('#cal-note').textContent = S.holidays.length
    ? `Skipping weekends and ${S.holidays.length} holiday${S.holidays.length>1?'s':''}.`
    : 'Skipping weekends only — no holidays entered.';
}
const draw=()=>{head();ruler();list()};

/* ============ dialog ============ */
const dlg=$('#dlg');
function open(title,body,btns){
  $('#d-title').textContent=title; $('#d-body').innerHTML=body; $('#d-foot').innerHTML='';
  btns.forEach(b=>{
    const e=document.createElement('button');
    e.className='act'+(b.primary?' primary':''); e.textContent=b.label;
    e.onclick=()=>{ if(b.act()!==false) dlg.close(); };
    $('#d-foot').appendChild(e);
  });
  const c=document.createElement('button');
  c.className='act'; c.textContent='Cancel'; c.onclick=()=>dlg.close();
  $('#d-foot').appendChild(c);
  dlg.showModal();
}

$('#a-disc').onclick=()=>{
  open('New disclosure',
    `<label class="f"><span>What happened</span><input id="q-t" placeholder="Board resolved to change the external auditor"></label>
     <label class="f"><span>Type — sets the annex and the deadline</span>
       <select id="q-k">${KINDS.map(k=>`<option value="${k.id}">${esc(k.l)} — ${esc(k.a)}</option>`).join('')}</select></label>
     <label class="f"><span>Date it arose</span><input type="date" id="q-d" value="${iso(NOW())}"></label>
     <label class="f" id="q-aw" hidden><span>تاريخ حق الحضور</span><input type="date" id="q-a"></label>
     <div id="q-p"></div>`,
    [{label:'Add the deadline',primary:true,act(){
      const ev=$('#q-d').value; if(!ev) return false;
      const d=deriveDisc($('#q-k').value,ev,$('#q-a').value);
      add({title:$('#q-t').value.trim()||d.label,due:d.due,annex:d.annex,rule:d.rule});
      save(); draw();
    }}]);
  const upd=()=>{
    const k=KINDS.find(x=>x.id===$('#q-k').value), ev=$('#q-d').value;
    $('#q-aw').hidden = k.c!=='before';
    if(!ev){$('#q-p').innerHTML='';return}
    const d=deriveDisc(k.id,ev,$('#q-a').value);
    const w=d.exact
      ? d.exact.toLocaleString('en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})
      : fmt(parse(d.due));
    $('#q-p').innerHTML=`<div class="prev"><div class="pr">
      <div class="t">File by · <span dir="auto">${esc(d.annex)}</span></div>
      <div class="dte">${esc(w)}</div>
      <div class="rl ar">${esc(d.rule)}</div></div></div>`;
  };
  ['#q-k','#q-d','#q-a'].forEach(s=>$(s).addEventListener('change',upd)); upd();
};

$('#a-ent').onclick=()=>{
  open('Entitlement dates',
    `<label class="f"><span>General assembly date</span><input type="date" id="e-a" value="${iso(addBiz(NOW(),20))}"></label>
     <label class="f"><span>يوم الاستحقاق — blank means 15 business days after</span><input type="date" id="e-e"></label>
     <div id="e-p"></div>`,
    [{label:'Add all of them',primary:true,act(){
      deriveEnt($('#e-a').value,$('#e-e').value).forEach(s=>
        add({title:s.t,due:s.due,rule:s.rule,annex:'استحقاقات'}));
      save(); draw();
    }}]);
  const upd=()=>{
    if(!$('#e-a').value){$('#e-p').innerHTML='';return}
    $('#e-p').innerHTML=`<div class="prev">${deriveEnt($('#e-a').value,$('#e-e').value).map(s=>
      `<div class="pr"><div class="t ar">${esc(s.t)}</div><div class="dte">${fmtS(parse(s.due))}</div>
       <div class="rl ar">${esc(s.rule)}</div></div>`).join('')}</div>`;
  };
  ['#e-a','#e-e'].forEach(s=>$(s).addEventListener('change',upd)); upd();
};

$('#a-add').onclick=()=>{
  open('Add a date',
    `<label class="f"><span>What</span><input id="n-t"></label>
     <label class="f"><span>Due</span><input type="date" id="n-d" value="${iso(addBiz(NOW(),3))}"></label>`,
    [{label:'Add',primary:true,act(){
      const t=$('#n-t').value.trim(); if(!t) return false;
      add({title:t,due:$('#n-d').value}); save(); draw();
    }}]);
};

$('#a-hol').onclick=()=>{
  const paint=()=>{
    $('#h-cur').innerHTML = S.holidays.length
      ? S.holidays.slice().sort().map(h=>`<span class="pill" style="margin:2px">${fmt(parse(h))}
          <button class="done" data-hx="${h}" style="padding:0 5px;margin-inline-start:4px">×</button></span>`).join('')
      : '<span style="color:var(--ink-3)">None entered.</span>';
  };
  open('Official holidays',
    `<p style="margin:0 0 12px;font-size:12px;color:var(--ink-3);line-height:1.55">
       Kuwait's holidays move with the Hijri calendar, so nothing is assumed here. Add the days your
       company observes and every deadline recomputes around them.</p>
     <label class="f"><span>Add a date</span><input type="date" id="h-new"></label>
     <div id="h-cur"></div>`,
    [{label:'Add',primary:true,act(){
      const v=$('#h-new').value;
      if(v&&!S.holidays.includes(v)){S.holidays.push(v);save();draw();paint()}
      return false;
    }}]);
  paint();
  $('#d-body').addEventListener('click',e=>{
    const b=e.target.closest('[data-hx]'); if(!b) return;
    S.holidays=S.holidays.filter(h=>h!==b.dataset.hx); save(); draw(); paint();
  });
};

/* ============ done / clear examples ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-done]'); if(!b) return;
  const i=S.items.find(x=>x.id===b.dataset.done);
  if(i){ i.done=true; i.closedAt=new Date().toISOString(); save(); draw(); }
});
$('#a-clear').onclick=()=>{
  S.items=S.items.filter(i=>!i.example); S.seeded='blank'; save(); draw();
};

/* ============ backup — the desk lives in this browser unless db is there ============ */
function toast(m){ $('#note').textContent=m; setTimeout(()=>{if($('#note').textContent===m)$('#note').textContent=''},5000) }
async function offer(name,data){
  if(DL){ try{await DL.save({filename:name,data}); toast('Saved.')}catch{toast('Save declined.')} return; }
  try{
    const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    const a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000); toast('Downloaded.');
  }catch{ toast('Could not save here.') }
}
$('#a-backup').onclick=()=>offer(`compliance-desk-${iso(NOW())}.json`,JSON.stringify(S,null,2));
$('#a-restore').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files?.[0]; e.target.value='';
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.items)) throw 0;
      S={...structuredClone(BLANK),...d}; save(); draw(); toast(`Restored ${S.items.length} items.`);
    }catch{ toast('Not a desk backup.') } };
  r.readAsText(f);
};

/* ============ theme ============ */
$('#theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const n=cur?(cur==='dark'?'light':'dark'):(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem('kfic-desk-theme',n)}catch{}
};
try{ const t=localStorage.getItem('kfic-desk-theme'); if(t)document.documentElement.setAttribute('data-theme',t) }catch{}

/* ============ examples so the page is never blank on first open ============ */
function examples(){
  const T=NOW();
  return {items:[
    {id:uid(),done:false,example:true,title:'Insider list refresh after the IR team change',
     due:iso(addBiz(T,2)),annex:'ملحق 5',rule:'التحديث خلال 5 أيام عمل من التغيّر'},
    {id:uid(),done:false,example:true,title:'EDD re-performed on 7 high-risk files',
     due:iso(addBiz(T,-4)),annex:'CMA'},
    {id:uid(),done:false,example:true,title:'Monthly liquidity return to CBK',
     due:iso(roll(addDays(T,12)))},
  ],holidays:[],seeded:null};
}

/* ============ boot ============ */
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}})();
S = (saved && saved.seeded!==null) ? {...structuredClone(BLANK),...saved} : examples();
draw();
setInterval(head,60000);

(async()=>{
  const [db,dl]=await Promise.all([
    window.claude?.use?.('db')??null,
    window.claude?.use?.('downloads')??null,
  ]);
  DB=db; DL=dl;
  if(!DB) return;
  try{
    const s=await DB.doc('state/desk').get();
    if(s.exists){ S={...structuredClone(BLANK),...s.data()}; draw(); }
    else if(S.seeded!==null) save();
    DB.doc('state/desk').onSnapshot(x=>{
      if(!x.exists||x.metadata.hasPendingWrites) return;
      S={...structuredClone(BLANK),...x.data()}; draw();
    },()=>{});
  }catch{}
})();
</script>
