<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Personal operating desk for Kuwait compliance work.">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F6F4" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2022%2022%22%3E%3Crect%20width%3D%2222%22%20height%3D%2222%22%20rx%3D%224%22%20fill%3D%22%23111418%22%2F%3E%3Cpath%20d%3D%22M4%203.5%20L18%203.5%20L11%2011%20L18%2018.5%20L4%2018.5%20L11%2011%20Z%22%20fill%3D%22%23C99457%22%2F%3E%3C%2Fsvg%3E">
<style>
  /* The skeleton the Artifact host would otherwise provide. */
  html{color-scheme:light dark}
  body{margin:0;font:14px system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>KFIC Compliance Calendar</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">

<style>
/* ===========================================================
   Monochrome. No hue anywhere — urgency is carried by FILL and
   BORDER WEIGHT, never colour, so it survives printing and
   reads the same to anyone who can't separate red from amber.
     overdue  = solid black chip
     due soon = 2px black outline
     later    = hairline outline
   =========================================================== */
:root{
  --paper:#FFFFFF;
  --raise:#FAFAFA;
  --ink:#000000;
  --ink-2:#3A3A3A;
  --ink-3:#6E6E6E;
  --line:#D6D6D6;
  --line-2:#ADADAD;
  --rest:#F2F2F2;
  --rest-2:#E6E6E6;
  --invert-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A0A0A; --raise:#121212;
    --ink:#FFFFFF; --ink-2:#C9C9C9; --ink-3:#8F8F8F;
    --line:#2C2C2C; --line-2:#4A4A4A;
    --rest:#1C1C1C; --rest-2:#272727;
    --invert-ink:#000000;
  }
}
:root[data-theme="dark"]{
  --paper:#0A0A0A; --raise:#121212;
  --ink:#FFFFFF; --ink-2:#C9C9C9; --ink-3:#8F8F8F;
  --line:#2C2C2C; --line-2:#4A4A4A;
  --rest:#1C1C1C; --rest-2:#272727;
  --invert-ink:#000000;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Archivo',system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ui{font-family:'Archivo',system-ui,sans-serif}
.lbl{font-family:'Archivo',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:22px}
@media(max-width:560px){.wrap{padding-inline:14px}}

/* ---------- masthead ---------- */
header{border-bottom:2px solid var(--ink);background:var(--paper)}
.mast{display:flex;align-items:baseline;gap:16px;padding-block:14px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:'Archivo',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:.1em;margin:0;text-transform:uppercase}
.brand .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-family:'Archivo',sans-serif;font-weight:600;display:block;line-height:1.3}
.mast .right{margin-inline-start:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stat{text-align:end}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600}
.btn-i{background:var(--paper);border:1px solid var(--line-2);color:var(--ink);
  width:30px;height:30px;border-radius:0;cursor:pointer;font-size:13px;line-height:1}
.btn-i:hover{background:var(--ink);color:var(--invert-ink);border-color:var(--ink)}

/* ---------- next-due banner ---------- */
.upnext{border-bottom:1px solid var(--line);background:var(--raise)}
.upnext .in{display:flex;align-items:center;gap:14px;padding-block:9px;flex-wrap:wrap}
.upnext .t{font-size:13px;font-weight:500;flex:1 1 auto;min-width:0}
.upnext .c{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;
  border:2px solid var(--ink);padding:2px 9px;white-space:nowrap}
.upnext .c.late{background:var(--ink);color:var(--invert-ink)}

/* ---------- toolbar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding-block:16px 12px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:2px}
.nav button{background:var(--paper);border:1px solid var(--line-2);color:var(--ink);
  width:32px;height:32px;cursor:pointer;font-size:15px;line-height:1;font-family:'IBM Plex Mono',monospace}
.nav button:hover{background:var(--ink);color:var(--invert-ink);border-color:var(--ink)}
.month{font-family:'Archivo',sans-serif;font-size:21px;font-weight:700;letter-spacing:-.01em;
  margin-inline:12px 4px;min-width:min(230px,52vw)}
.month .yr{color:var(--ink-3);font-weight:400}
.bar .acts{margin-inline-start:auto;display:flex;gap:7px;flex-wrap:wrap}
.btn{font-family:'Archivo',sans-serif;font-size:12px;font-weight:600;letter-spacing:.02em;
  background:var(--paper);border:1px solid var(--ink);color:var(--ink);
  padding:8px 13px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--invert-ink)}
.btn.solid{background:var(--ink);color:var(--invert-ink)}
.btn.solid:hover{background:var(--paper);color:var(--ink)}
.btn.ghost{border-color:var(--line-2);font-weight:500}

/* ---------- the calendar ---------- */
.cal{border:2px solid var(--ink);border-bottom:none}
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--ink)}
.dow div{font-family:'Archivo',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;padding:7px 8px;border-inline-end:1px solid var(--line);color:var(--ink-2)}
.dow div:last-child{border-inline-end:none}
.dow div.we{background:var(--rest);color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{border-inline-end:1px solid var(--line);border-bottom:2px solid var(--ink);
  min-height:116px;padding:6px 7px 8px;display:flex;flex-direction:column;gap:5px;
  background:var(--paper);position:relative;text-align:start}
.cell:nth-child(7n){border-inline-end:none}
.cell.we{background:var(--rest)}
.cell.hol{background:repeating-linear-gradient(135deg,var(--rest),var(--rest) 6px,var(--rest-2) 6px,var(--rest-2) 12px)}
.cell.out{background:var(--raise)}
.cell.out .num{color:var(--line-2)}
.cell.today{box-shadow:inset 0 5px 0 var(--ink)}
.cell.today .num{font-weight:700}
.cell.pick{outline:3px solid var(--ink);outline-offset:-3px;z-index:1}
.cnum{display:flex;align-items:baseline;gap:6px}
.num{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;line-height:1.1}
.tag{font-family:'Archivo',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.cell.today .tag{color:var(--ink)}

.chip{display:block;width:100%;text-align:start;font:inherit;font-size:10.5px;line-height:1.3;
  padding:3px 5px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);
  cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip:hover{border-color:var(--ink)}
.chip.soon{border:2px solid var(--ink);font-weight:600;padding:2px 4px}
.chip.late{background:var(--ink);color:var(--invert-ink);border-color:var(--ink);font-weight:600}
.more{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-3);
  background:none;border:none;cursor:pointer;padding:1px 0;text-align:start;text-decoration:underline}

@media(max-width:700px){
  .cell{min-height:70px;padding:4px 4px 6px;gap:3px}
  .chip{display:none}
  .more{display:none}
  .dots{display:flex;gap:2px;flex-wrap:wrap}
  .dot{width:6px;height:6px;border:1px solid var(--ink);border-radius:50%}
  .dot.late{background:var(--ink)}
  .dot.soon{box-shadow:inset 0 0 0 1px var(--ink)}
}
@media(min-width:701px){.dots{display:none}}

/* ---------- list ---------- */
.sec{margin-top:30px}
.sechd{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);
  padding-bottom:5px;margin-bottom:0;flex-wrap:wrap}
.sechd h2{font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin:0}
.sechd .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3)}
.sechd .clear{margin-inline-start:auto;background:none;border:none;font:inherit;font-size:11.5px;
  color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:0}
.sechd .clear:hover{color:var(--ink)}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:0 14px;align-items:start;
  padding:11px 0;border-bottom:1px solid var(--line)}
@media(max-width:560px){.item{grid-template-columns:58px 1fr;row-gap:7px}
  .item .act{grid-column:2;justify-self:start}}
.when{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;line-height:1.35;padding-top:1px}
.when span{display:block;font-size:10px;font-weight:400;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.ttl{font-size:13.5px;font-weight:500;line-height:1.4}
.rule{font-family:'IBM Plex Sans Arabic',sans-serif;direction:ltr;unicode-bidi:isolate;
  font-size:11px;color:var(--ink-3);line-height:1.55;margin-top:3px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.bdg{font-family:'Archivo',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid var(--line-2);padding:1.5px 5px;color:var(--ink-2)}
.bdg.fill{background:var(--ink);color:var(--invert-ink);border-color:var(--ink)}
.bdg.ar{font-family:'IBM Plex Sans Arabic',sans-serif;text-transform:none;letter-spacing:0;font-weight:600}
.act{font-family:'Archivo',sans-serif;font-size:11px;font-weight:600;background:var(--paper);
  border:1px solid var(--line-2);color:var(--ink-2);padding:4px 10px;cursor:pointer}
.act:hover{background:var(--ink);color:var(--invert-ink);border-color:var(--ink)}
.none{padding:22px 0;color:var(--ink-3);font-size:12.5px;border-bottom:1px solid var(--line)}

/* ---------- legend + footer ---------- */
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding-block:12px 0;
  font-family:'Archivo',sans-serif;font-size:10px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.legend i{display:inline-block;width:16px;height:11px;margin-inline-end:6px;vertical-align:-1px;
  border:1px solid var(--line-2)}
.legend i.late{background:var(--ink);border-color:var(--ink)}
.legend i.soon{border:2px solid var(--ink)}
.legend i.we{background:var(--rest)}
.legend i.hol{background:repeating-linear-gradient(135deg,var(--rest),var(--rest) 4px,var(--rest-2) 4px,var(--rest-2) 8px)}
footer{border-top:1px solid var(--line);margin-top:34px;padding-block:14px 40px;
  font-size:11.5px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
footer button{background:none;border:none;color:var(--ink-2);font:inherit;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;padding:0}
footer button:hover{color:var(--ink)}
.seedbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);
  padding:9px 12px;margin-top:20px;font-size:12px;color:var(--ink-2)}

/* ---------- dialog ---------- */
dialog{border:2px solid var(--ink);border-radius:0;padding:0;background:var(--paper);color:var(--ink);
  max-width:min(580px,94vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{padding:12px 16px;border-bottom:2px solid var(--ink);font-family:'Archivo',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.db{padding:16px;max-height:62vh;overflow-y:auto}
.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-family:'Archivo',sans-serif;font-size:9.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
input,select{width:100%;background:var(--paper);border:1px solid var(--line-2);color:var(--ink);
  border-radius:0;padding:8px 9px;font-family:inherit;font-size:13px}
input:focus,select:focus{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.prev{border:2px solid var(--ink);margin-top:4px}
.pr{padding:9px 11px;display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:baseline}
.pr+.pr{border-top:1px solid var(--line)}
.pr .t{font-size:12.5px;font-weight:500}
.pr .t.arabic{font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;unicode-bidi:isolate}
.pr .dte{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;white-space:nowrap}
.pr .rl{grid-column:1/3;font-family:'IBM Plex Sans Arabic',sans-serif;direction:ltr;
  unicode-bidi:isolate;font-size:11px;color:var(--ink-3);line-height:1.55}

@media print{
  .bar,.upnext,footer,.seedbar,.btn-i,.act,.more{display:none!important}
  body{background:#fff;color:#000}
  .cell{min-height:104px}
  .chip{display:-webkit-box!important}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header>
  <div class="wrap mast">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <path d="M3 2 L19 2 L11 11 L19 20 L3 20 L11 11 Z" fill="currentColor"/>
      </svg>
      <div>
        <h1>KFIC</h1>
        <span class="sub">Compliance Calendar</span>
      </div>
    </div>
    <div class="right">
      <div class="stat">
        <div class="lbl">Today</div>
        <div class="v" id="h-today">—</div>
      </div>
      <div class="stat">
        <div class="lbl">Open dates</div>
        <div class="v" id="h-open">—</div>
      </div>
      <button class="btn-i" id="theme" aria-label="Switch between light and dark" title="Switch theme">◐</button>
    </div>
  </div>
</header>

<div class="upnext">
  <div class="wrap in">
    <span class="lbl">Next due</span>
    <span class="t" id="n-title">—</span>
    <span class="c" id="n-count">—</span>
  </div>
</div>

<main class="wrap">
  <div class="bar">
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="month" id="m-label">—</div>
    <button class="btn ghost" id="to-today">Today</button>
    <div class="acts">
      <button class="btn solid" id="a-disc">New disclosure</button>
      <button class="btn" id="a-ent">Entitlement dates</button>
      <button class="btn" id="a-add">Add a date</button>
    </div>
  </div>

  <div class="cal">
    <div class="dow" id="dow"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="legend">
    <span><i class="late"></i>Overdue</span>
    <span><i class="soon"></i>Due within 2 days</span>
    <span><i></i>Scheduled</span>
    <span><i class="we"></i>Weekend · الجمعة والسبت</span>
    <span><i class="hol"></i>Official holiday</span>
  </div>

  <section class="sec" id="sec-over" hidden>
    <div class="sechd"><h2>Overdue</h2><span class="n" id="n-over"></span></div>
    <div id="list-over"></div>
  </section>

  <section class="sec">
    <div class="sechd">
      <h2 id="list-title">This month</h2>
      <span class="n" id="n-month"></span>
      <button class="clear" id="unpick" hidden>Show the whole month</button>
    </div>
    <div id="list-month"></div>
  </section>

  <div class="seedbar" id="seedbar" hidden>
    <span>Three example dates are shown so the calendar isn't empty.</span>
    <button class="btn ghost" id="a-clear">Clear them</button>
  </div>

  <footer>
    <span id="cal-note">—</span>
    <button id="a-hol">Holidays</button>
    <button id="a-print">Print</button>
    <button id="a-backup">Back up</button>
    <button id="a-restore">Restore</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <span id="note"></span>
  </footer>
</main>

<dialog id="dlg">
  <div class="dh" id="d-title">—</div>
  <div class="db" id="d-body"></div>
  <div class="df" id="d-foot"></div>
</dialog>

<script>
"use strict";

/* ===== Kuwait calendar: Fri+Sat weekend, holidays supplied by the user ===== */
const DAY_AR=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const diff=(a,b)=>Math.round((day0(b)-day0(a))/86400000);
const isWeekend=d=>d.getDay()===5||d.getDay()===6;
const isHoliday=d=>S.holidays.includes(iso(d));
const isBiz=d=>!isWeekend(d)&&!isHoliday(d);
function addBiz(d,n){let x=new Date(d),s=n<0?-1:1,k=Math.abs(n);while(k>0){x=addDays(x,s);if(isBiz(x))k--}return x}
function roll(d){let x=new Date(d);while(!isBiz(x))x=addDays(x,1);return x}
const fmtFull=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const NOW=()=>new Date();

/* Material information out of hours: 15 minutes before the next session (09:00). */
function cutoff(from){
  let d=new Date(from), m=d.getHours()*60+d.getMinutes();
  if(!isBiz(d)||m>=525) d=roll(addDays(d,1));
  const c=day0(d); c.setHours(8,45,0,0); return c;
}

/* ===== The rules. Arabic quoted verbatim — it is the justification. ===== */
const KINDS=[
 {id:'material_out',l:'Material information — arose outside working hours',a:'ملحق 10',r:'قبل 15 دقيقة على الأقل من جلسة التداول التالية',c:'cut'},
 {id:'material_in', l:'Material information — arose during working hours',a:'ملحق 10',r:'الإفصاح فوراً',c:'now'},
 {id:'board_res',   l:'Board meeting — results',a:'ملحق 10',r:'تُفصح خلالها أو قبل 15 دقيقة من الجلسة التالية',c:'cut'},
 {id:'board_call',  l:'Board meeting — invitation',a:'ملحق 9',r:'الدعوة للاجتماع',c:'now'},
 {id:'litigation',  l:'Litigation or judgment (initial or supplementary)',a:'ملحق 7',r:'الملحق 7 لكل إفصاح متعلق بدعوى أو حكم — لا يُستخدم الملحق 12 إطلاقاً',c:'now'},
 {id:'rating',      l:'Credit rating — new or changed',a:'ملحق 8',r:'تصنيف ائتماني جديد أو متغيّر',c:'now'},
 {id:'agm_call',    l:'General assembly — invitation',a:'ملحق 14',r:'قبل 5 أيام عمل من تاريخ حيازة حق الحضور',c:'before',n:5},
 {id:'bonds',       l:'Listed bonds or sukuk',a:'ملحق 13',r:'سندات/صكوك مدرجة',c:'now'},
 {id:'corp_action', l:'Share entitlements / corporate action',a:'نموذج استحقاقات الأسهم',r:'مسار الرفع (ب): البورصة أولاً ثم الهيئة آخراً',c:'now'},
 {id:'corrective',  l:'Corrective — fixes wrong information announced',a:'ملحق 11',r:'يصحّح معلومة خاطئة في إعلان سابق',c:'now'},
 {id:'supplementary',l:'Supplementary — adds a development',a:'ملحق 12',r:'يضيف تطوراً جديداً (إلا الدعاوى والأحكام)',c:'now'},
 {id:'bo_initial',  l:'Beneficial owner — first time at 5% or more',a:'ملحق 1',r:'المهلة: 5 أيام عمل',c:'biz',n:5},

 {id:'bo_group',    l:'Group ownership aggregating 5% or more',a:'ملحق 3',r:'ملكية مجموعة مجمّعة 5% فأكثر',c:'biz',n:5},
 {id:'major_annual',l:'Annual disclosure of major holders (5%+)',a:'ملحق 4',r:'إفصاح سنوي عن كبار الملاك',c:'biz',n:5},

 {id:'insider_deal',l:'Insider dealt in the security',a:'ملحق 6',r:'خلال يومي عمل (قبل الجلسة الثالثة)',c:'biz',n:2},

/* The استحقاقات timetable, computed off the assembly date. */
const ENT=[
 {t:'إخطار من الجمعية — نموذج المقاصة وجدول الأعمال وتقرير الحوكمة',r:'قبل 5 أيام عمل على الأقل من تاريخ حق حضور الجمعية',f:'attend',biz:-5},
 {t:'الإعلان الأول — إعلان بالجريدة',r:'قبل 7 أيام على الأقل من الإعلان التذكيري',f:'remind',cal:-7},
 {t:'حيازة حق الحضور',r:'ثلاثة أيام تداول قبل تاريخ حق الحضور',f:'attend',biz:-3},
 {t:'حق حضور الجمعية العامة',r:'قبل 10 أيام من تاريخ الجمعية — وإن وقع في عطلة يؤخذ بيوم العمل التالي',f:'agm',cal:-10,roll:1},
 {t:'الإعلان التذكيري',r:'قبل 7 أيام على الأقل من موعد الجمعية',f:'agm',cal:-7},
 {t:'إفصاح نتائج الجمعية',r:'نفس يوم الجمعية العامة',f:'agm',cal:0},
 {t:'تأكيد نموذج الاستحقاق',r:'قبل 8 أيام على الأقل من يوم الاستحقاق',f:'ent',cal:-8},
 {t:'يوم حيازة السهم',r:'ثلاثة أيام تداول قبل يوم استحقاق السهم',f:'ent',biz:-3},
 {t:'يوم الاستحقاق',r:'حسب جدول أعمال الجمعية (15 يوم عمل على الأقل بعد الجمعية)',f:'ent',cal:0},
 {t:'يوم التوزيع',r:'حسب جدول أعمال الجمعية (4 أيام بعد يوم الاستحقاق)',f:'ent',cal:4},
 {t:'محضر الجمعية وتعديل سجل الاستثمار — الهيئة والبنك المركزي',r:'خلال مدة أقصاها 10 أيام عمل بعد انعقاد الجمعية',f:'agm',biz:10},
];

function deriveDisc(id,evISO,anchorISO){
  const k=KINDS.find(x=>x.id===id), ev=parse(evISO);
  let due, exact=null;
  if(k.c==='cut'){ exact=cutoff(ev); due=day0(exact); }
  else if(k.c==='biz') due=addBiz(ev,k.n);
  else if(k.c==='before') due=addBiz(anchorISO?parse(anchorISO):ev,-k.n);
  else due=roll(ev);
  return {annex:k.a,rule:k.r,label:k.l,due:iso(due),exact};
}
function deriveEnt(agmISO,entISO){
  const agm=parse(agmISO);
  const A={agm,attend:roll(addDays(agm,-10)),remind:addDays(agm,-7),
           ent:entISO?parse(entISO):addBiz(agm,15)};
  return ENT.map(s=>{
    const b=A[s.f]; let d=new Date(b);
    if(s.biz!==undefined)d=addBiz(b,s.biz);
    if(s.cal!==undefined)d=addDays(b,s.cal);
    if(s.roll)d=roll(d);
    return {t:s.t,rule:s.r,due:iso(d)};
  }).sort((a,b)=>a.due.localeCompare(b.due));
}

/* ===== state ===== */
const KEY='kfic-desk-v2';
const BLANK={items:[],holidays:[],seeded:null};
let S=structuredClone(BLANK), DB=null, DL=null;
let view=day0(NOW()), picked=null;

const uid=()=>'x'+Math.random().toString(36).slice(2,9);
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}
  if(DB) DB.doc('state/desk').set({...S,savedAt:new Date().toISOString()}).catch(()=>{});
}
function add(o){ S.items.push({id:uid(),done:false,...o}); }

const live=()=>S.items.filter(i=>!i.done);
const urgency=i=>{const d=diff(NOW(),parse(i.due));return d<0?'late':d<=2?'soon':''};
function countdown(i){
  const d=diff(NOW(),parse(i.due));
  if(d<0) return `${Math.abs(d)}d late`;
  if(d===0) return 'Today';
  if(d===1) return 'Tomorrow';
  return `in ${d}d`;
}

/* ===== render ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function masthead(){
  const n=NOW();
  $('#h-today').textContent = fmtFull(n) + (isBiz(n)?'' : isHoliday(n)?' · holiday' : ' · '+DAY_AR[n.getDay()]);
  $('#h-open').textContent = live().length;
  const u=live().slice().sort((a,b)=>a.due.localeCompare(b.due))[0];
  $('#n-title').textContent = u ? u.title : 'Nothing outstanding';
  const c=$('#n-count');
  c.textContent = u ? countdown(u) : '—';
  c.className = 'c' + (u && urgency(u)==='late' ? ' late' : '');
}

function dowRow(){
  $('#dow').innerHTML = DOW.map((d,i)=>
    `<div class="${i>=5?'we':''}">${d}</div>`).join('');
}

function calendar(){
  const y=view.getFullYear(), m=view.getMonth();
  $('#m-label').innerHTML = `${MONTHS[m]} <span class="yr">${y}</span>`;
  const first=new Date(y,m,1);
  const start=addDays(first,-first.getDay());          /* week starts Sunday */
  const last=new Date(y,m+1,0);
  const cells=Math.ceil((first.getDay()+last.getDate())/7)*7;

  const g=$('#grid'); g.innerHTML='';
  for(let i=0;i<cells;i++){
    const d=addDays(start,i), key=iso(d);
    const on=live().filter(x=>x.due===key).sort((a,b)=>a.title.localeCompare(b.title));
    const out=d.getMonth()!==m;
    const el=document.createElement('button');
    el.type='button';
    el.className='cell'+(isWeekend(d)?' we':'')+(isHoliday(d)?' hol':'')+(out?' out':'')
      +(key===iso(NOW())?' today':'')+(key===picked?' pick':'');
    el.dataset.day=key;
    el.setAttribute('aria-label',`${fmtFull(d)}, ${on.length} due`);
    const tag = key===iso(NOW()) ? 'Today' : isHoliday(d) ? 'Holiday' : '';
    el.innerHTML =
      `<div class="cnum"><span class="num">${String(d.getDate()).padStart(2,'0')}</span>
        ${tag?`<span class="tag">${tag}</span>`:''}</div>`
      + on.slice(0,3).map(x=>`<span class="chip ${urgency(x)}">${esc(x.title)}</span>`).join('')
      + (on.length>3?`<span class="more">+${on.length-3} more</span>`:'')
      + (on.length?`<span class="dots">${on.map(x=>`<i class="dot ${urgency(x)}"></i>`).join('')}</span>`:'');
    g.appendChild(el);
  }
}

function itemRow(i){
  const u=urgency(i), d=parse(i.due);
  return `<div class="item">
    <div class="when">${d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}
      <span>${DOW[d.getDay()]}</span></div>
    <div>
      <div class="ttl" dir="auto">${esc(i.title)}</div>
      ${i.rule?`<div class="rule">${esc(i.rule)}</div>`:''}
      <div class="badges">
        <span class="bdg${u==='late'?' fill':''}">${esc(countdown(i))}</span>
        ${i.annex?`<span class="bdg ar" dir="auto">${esc(i.annex)}</span>`:''}
        ${i.example?'<span class="bdg">Example</span>':''}
      </div>
    </div>
    <button class="act" data-done="${i.id}">Done</button>
  </div>`;
}

function lists(){
  const all=live().slice().sort((a,b)=>a.due.localeCompare(b.due));

  const over=all.filter(i=>diff(NOW(),parse(i.due))<0);
  $('#sec-over').hidden = !over.length;
  $('#n-over').textContent = over.length || '';
  $('#list-over').innerHTML = over.map(itemRow).join('');

  const y=view.getFullYear(), m=view.getMonth();
  let set, title;
  if(picked){
    set = all.filter(i=>i.due===picked);
    title = parse(picked).toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long'});
  } else {
    set = all.filter(i=>{const d=parse(i.due);return d.getFullYear()===y&&d.getMonth()===m});
    title = `${MONTHS[m]} ${y}`;
  }
  $('#list-title').textContent = title;
  $('#n-month').textContent = set.length || '';
  $('#unpick').hidden = !picked;
  $('#list-month').innerHTML = set.length
    ? set.map(itemRow).join('')
    : `<div class="none">Nothing due ${picked?'that day':'this month'}.</div>`;

  $('#seedbar').hidden = !S.items.some(i=>i.example&&!i.done);
  $('#cal-note').textContent = S.holidays.length
    ? `Weekends plus ${S.holidays.length} holiday${S.holidays.length>1?'s':''} excluded from every calculation.`
    : 'Weekends excluded. No official holidays entered yet.';
}

const draw=()=>{masthead();calendar();lists()};

/* ===== month navigation ===== */
$('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);picked=null;draw()};
$('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);picked=null;draw()};
$('#to-today').onclick=()=>{view=day0(NOW());picked=null;draw()};
$('#unpick').onclick=()=>{picked=null;draw()};
$('#grid').addEventListener('click',e=>{
  const c=e.target.closest('[data-day]'); if(!c) return;
  const k=c.dataset.day;
  picked = picked===k ? null : k;
  const d=parse(k);
  if(d.getMonth()!==view.getMonth()) view=new Date(d.getFullYear(),d.getMonth(),1);
  draw();
});

/* ===== dialog ===== */
const dlg=$('#dlg');
function open(title,body,btns){
  $('#d-title').textContent=title; $('#d-body').innerHTML=body; $('#d-foot').innerHTML='';
  btns.forEach(b=>{
    const e=document.createElement('button');
    e.className='btn'+(b.primary?' solid':''); e.textContent=b.label;
    e.onclick=()=>{ if(b.act()!==false) dlg.close(); };
    $('#d-foot').appendChild(e);
  });
  const c=document.createElement('button');
  c.className='btn ghost'; c.textContent='Cancel'; c.onclick=()=>dlg.close();
  $('#d-foot').appendChild(c);
  dlg.showModal();
}
function goTo(dueISO){
  const d=parse(dueISO);
  view=new Date(d.getFullYear(),d.getMonth(),1); picked=dueISO;
}

$('#a-disc').onclick=()=>{
  open('New disclosure',
    `<label class="f"><span>What happened</span><input id="q-t" placeholder="Board resolved to change the external auditor"></label>
     <label class="f"><span>Type — sets the annex and the deadline</span>
       <select id="q-k">${KINDS.map(k=>`<option value="${k.id}">${esc(k.l)} — ${esc(k.a)}</option>`).join('')}</select></label>
     <label class="f"><span>Date it arose</span><input type="date" id="q-d" value="${iso(NOW())}"></label>
     <label class="f" id="q-aw" hidden><span>تاريخ حق الحضور</span><input type="date" id="q-a"></label>
     <div id="q-p"></div>`,
    [{label:'Put it on the calendar',primary:true,act(){
      const ev=$('#q-d').value; if(!ev) return false;
      const d=deriveDisc($('#q-k').value,ev,$('#q-a').value);
      add({title:$('#q-t').value.trim()||d.label,due:d.due,annex:d.annex,rule:d.rule});
      goTo(d.due); save(); draw();
    }}]);
  const upd=()=>{
    const k=KINDS.find(x=>x.id===$('#q-k').value), ev=$('#q-d').value;
    $('#q-aw').hidden = k.c!=='before';
    if(!ev){$('#q-p').innerHTML='';return}
    const d=deriveDisc(k.id,ev,$('#q-a').value);
    const w=d.exact
      ? d.exact.toLocaleString('en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})
      : fmtFull(parse(d.due));
    $('#q-p').innerHTML=`<div class="prev"><div class="pr">
      <div class="t">File by · <span dir="auto">${esc(d.annex)}</span></div>
      <div class="dte">${esc(w)}</div>
      <div class="rl">${esc(d.rule)}</div></div></div>`;
  };
  ['#q-k','#q-d','#q-a'].forEach(s=>$(s).addEventListener('change',upd)); upd();
};

$('#a-ent').onclick=()=>{
  open('Entitlement dates',
    `<label class="f"><span>General assembly date</span><input type="date" id="e-a" value="${iso(addBiz(NOW(),20))}"></label>
     <label class="f"><span>يوم الاستحقاق — blank means 15 business days after</span><input type="date" id="e-e"></label>
     <div id="e-p"></div>`,
    [{label:'Put them all on the calendar',primary:true,act(){
      const steps=deriveEnt($('#e-a').value,$('#e-e').value);
      steps.forEach(s=>add({title:s.t,due:s.due,rule:s.rule,annex:'استحقاقات'}));
      if(steps[0]) goTo(steps[0].due);
      save(); draw();
    }}]);
  const upd=()=>{
    if(!$('#e-a').value){$('#e-p').innerHTML='';return}
    $('#e-p').innerHTML=`<div class="prev">${deriveEnt($('#e-a').value,$('#e-e').value).map(s=>
      `<div class="pr"><div class="t arabic">${esc(s.t)}</div>
       <div class="dte">${parse(s.due).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</div>
       <div class="rl">${esc(s.rule)}</div></div>`).join('')}</div>`;
  };
  ['#e-a','#e-e'].forEach(s=>$(s).addEventListener('change',upd)); upd();
};

$('#a-add').onclick=()=>{
  open('Add a date',
    `<label class="f"><span>What</span><input id="n-t"></label>
     <label class="f"><span>Due</span><input type="date" id="n-d" value="${picked||iso(addBiz(NOW(),3))}"></label>`,
    [{label:'Add',primary:true,act(){
      const t=$('#n-t').value.trim(); if(!t) return false;
      const due=$('#n-d').value;
      add({title:t,due}); goTo(due); save(); draw();
    }}]);
};

$('#a-hol').onclick=()=>{
  const paint=()=>{
    $('#h-cur').innerHTML = S.holidays.length
      ? S.holidays.slice().sort().map(h=>`<span class="bdg" style="margin:2px">${fmtFull(parse(h))}
          <button class="act" data-hx="${h}" style="padding:0 5px;margin-inline-start:4px">×</button></span>`).join('')
      : '<span style="color:var(--ink-3)">None entered.</span>';
  };
  open('Official holidays',
    `<p style="margin:0 0 13px;font-size:12px;color:var(--ink-3);line-height:1.6">
       Kuwait's holidays move with the Hijri calendar, so nothing is assumed here. Add the days your
       company observes — they shade on the calendar and drop out of every deadline calculation.</p>
     <label class="f"><span>Add a date</span><input type="date" id="h-new"></label>
     <div id="h-cur"></div>`,
    [{label:'Add',primary:true,act(){
      const v=$('#h-new').value;
      if(v&&!S.holidays.includes(v)){S.holidays.push(v);save();draw();paint()}
      return false;
    }}]);
  paint();
  $('#d-body').addEventListener('click',e=>{
    const b=e.target.closest('[data-hx]'); if(!b) return;
    S.holidays=S.holidays.filter(h=>h!==b.dataset.hx); save(); draw(); paint();
  });
};

/* ===== done / clear / print ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-done]'); if(!b) return;
  const i=S.items.find(x=>x.id===b.dataset.done);
  if(i){ i.done=true; i.closedAt=new Date().toISOString(); save(); draw(); }
});
$('#a-clear').onclick=()=>{ S.items=S.items.filter(i=>!i.example); S.seeded='blank'; save(); draw(); };
$('#a-print').onclick=()=>window.print();

/* ===== backup — on the web the calendar lives in this browser ===== */
function toast(m){ $('#note').textContent=m; setTimeout(()=>{if($('#note').textContent===m)$('#note').textContent=''},5000) }
async function offer(name,data){
  if(DL){ try{await DL.save({filename:name,data}); toast('Saved.')}catch{toast('Save declined.')} return; }
  try{
    const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    const a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000); toast('Downloaded.');
  }catch{ toast('Could not save here.') }
}
$('#a-backup').onclick=()=>offer(`compliance-calendar-${iso(NOW())}.json`,JSON.stringify(S,null,2));
$('#a-restore').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files?.[0]; e.target.value=''; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.items)) throw 0;
      S={...structuredClone(BLANK),...d}; save(); draw(); toast(`Restored ${S.items.length} dates.`);
    }catch{ toast('Not a calendar backup.') } };
  r.readAsText(f);
};

/* ===== theme ===== */
$('#theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const n=cur?(cur==='dark'?'light':'dark'):(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem('kfic-desk-theme',n)}catch{}
};
try{ const t=localStorage.getItem('kfic-desk-theme'); if(t)document.documentElement.setAttribute('data-theme',t) }catch{}

/* ===== examples so the calendar is never empty on a first open ===== */
function examples(){
  const T=NOW();
  return {items:[
    {id:uid(),done:false,example:true,title:'Insider list refresh after the IR team change',
     due:iso(addBiz(T,2)),annex:'ملحق 5',rule:'التحديث خلال 5 أيام عمل من التغيّر'},
    {id:uid(),done:false,example:true,title:'EDD re-performed on 7 high-risk files',
     due:iso(addBiz(T,-4)),annex:'CMA'},
    {id:uid(),done:false,example:true,title:'Monthly liquidity return to CBK',
     due:iso(roll(addDays(T,12)))},
  ],holidays:[],seeded:null};
}

/* ===== boot ===== */
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}})();
S = (saved && saved.seeded!==null) ? {...structuredClone(BLANK),...saved} : examples();
dowRow(); draw();
setInterval(masthead,60000);

(async()=>{
  const [db,dl]=await Promise.all([
    window.claude?.use?.('db')??null,
    window.claude?.use?.('downloads')??null,
  ]);
  DB=db; DL=dl;
  if(!DB) return;
  try{
    const s=await DB.doc('state/desk').get();
    if(s.exists){ S={...structuredClone(BLANK),...s.data()}; draw(); }
    else if(S.seeded!==null) save();
    DB.doc('state/desk').onSnapshot(x=>{
      if(!x.exists||x.metadata.hasPendingWrites) return;
      S={...structuredClone(BLANK),...x.data()}; draw();
    },()=>{});
  }catch{}
})();
</script>
