# compliance-desk.html at the root is the Artifact-body source; build-web.mjs
# wraps it into docs/, which is what gets published.
[build]
  publish = "docs"
  command = "node build-web.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
